<app-menu></app-menu>
<div id="main">
<div class="card shadow center">
  <div class="card-header"><span i18n>Room</span></div>
	<div class="card-header shadow-sm">
    <button type="button" (click)="goToChat()" class="btn bg-gradient btn-primary btn-sm"><fa-icon [icon]="faXmark"></fa-icon>&nbsp;<span i18n>Back</span></button>
	</div>
	<div class="card-body">

		<div class="form-group row">
      <label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Created on</span></label>
			<div class="col-sm-8">
        <input type="text" class="form-control form-control-sm field-separate" id="createdOn" name="createdOn" [(ngModel)]="room.createdOn" disabled>
			</div>
		</div>

		<div class="form-group row">
      <label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Updated on</span></label>
			<div class="col-sm-8">
        <input type="text" class="form-control form-control-sm field-separate" id="updatedOn" name="updatedOn" [(ngModel)]="room.updatedOn" disabled>
			</div>
		</div>

    <div class="form-group row">
      <label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Name</span>&nbsp;<sup><span class="text-danger">*</span></sup></label>
      <div class="col-sm-8">
        <input type="text" class="form-control form-control-sm field-separate" id="name" name="name" [(ngModel)]="room.name" disabled>
      </div>
    </div>

		<div class="form-group row">
      <label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>State</span></label>
			<div class="col-sm-8">
		  	<div class="form-group field-separate">
          <select class="form-select form-select-sm" id="state" name="state" [(ngModel)]="room.state" disabled>
          @for (st of ST; track st.key) { <option [value]="st.key">{{ st.value }}</option> }
					</select>
				</div>
			</div>
		</div>

    @if (room.topic.length > 0) {
		<div class="form-group row field-gap">
			<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Topic</span></label>
			<div class="col-sm-8">
        <input type="text" class="form-control form-control-sm field-separate" id="topic" name="topic" [(ngModel)]="room.topic" disabled>
			</div>
		</div>
    }
    @if (room.notes.length > 0) {
		<div class="form-group row">
      <label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Notes</span></label>
			<div class="col-sm-8">
        <textarea rows="4" class="form-control form-control-sm field-separate" id="notes" name="notes" [(ngModel)]="room.notes" disabled></textarea>
			</div>
		</div>
    }

		<div class="form-group row field-gap">
			<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Purge method</span></label>
			<div class="col-sm-8">
		  	<div class="form-group field-separate">
					<select class="form-select form-select-sm" id="purgeType" name="purgeType" [(ngModel)]="room.purgeType" disabled>
					@for (pm of PM; track pm.key) { <option [value]="pm.key">{{ pm.value }}</option> }
					</select>
				</div>
			</div>
		</div>

    @if (room.purgeType === 'MESSAGES_LIMITED') {
		<div class="form-group row field-gap">
			<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Messages limit</span></label>
			<div class="col-sm-2">
  			<input type="number" min="0" max="1000" class="form-control form-control-sm field-separate" id="messagesLimit" name="messagesLimit" [(ngModel)]="room.messagesLimit">
  		</div>
  		<label class="col-sm-6 col-form-label col-form-label-sm label-nobr"><span i18n>maximum number of lines to keep.<br/>0 for infinite</span></label>
  	</div>
    } @else if (room.purgeType === 'TIME_LIMITED') {
  	<div class="form-group row field-gap">
  		<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Time duration</span></label>
  	 	<div class="col-sm-2">
  			<input type="number" min="0" max="4321" class="form-control form-control-sm field-separate" id="timeDuration" name="timeDuration" [(ngModel)]="room.timeDuration">
  		</div>
  		<label class="col-sm-6 col-form-label col-form-label-sm label-nobr"><span i18n>minutes lifespan before delete.<br/>0 for infinite</span></label>
  	</div>
    }

	</div>
  @if (this.logged && ((this.role === "ADMIN") || (this.role === "REGUL") || (this.userId == this.room.ownerId))) {
  <div class="card-footer">
    <button type="button" (click)="updateRoom(room.roomId)" class="btn bg-gradient btn-primary btn-sm"><fa-icon [icon]="faPen"></fa-icon>&nbsp;<span i18n>Edit</span></button>
	</div>
  }
</div>
</div>
