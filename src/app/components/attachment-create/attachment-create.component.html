<app-menu></app-menu>
<div id="main">
<form #formRef="ngForm" (ngSubmit)="addAttachment()" class="needs-validation">
	<div class="card shadow center">
		<div class="card-header"><span i18n>Add an attachment</span></div>
		<div class="card-header shadow-sm">
			<button (click)="goToAttachmentList()" class="btn bg-gradient btn-primary btn-sm"><fa-icon [icon]="faXmark"></fa-icon>&nbsp;<span i18n>Back</span></button>
		</div>
		<div class="card-body">

			<div class="form-group row">
				<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Public comments</span></label>
				<div class="col-sm-8">
					<textarea class="form-control form-control-sm field-separate" id="commentsPublic" name="commentsPublic" [(ngModel)]="attachment.commentsPublic"></textarea>
				</div>
			</div>

			<div class="form-group row">
				<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Private comments</span></label>
				<div class="col-sm-8">
					<textarea class="form-control form-control-sm field-separate" id="commentsPrivate" name="commentsPrivate" [(ngModel)]="attachment.commentsPrivate"></textarea>
				</div>
			</div>

			<div class="form-group row">
				<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>File</span>&nbsp;<sup><span class="text-danger">*</span></sup></label>
				<div class="col-sm-8">
					<input type="file" class="form-control form-control-sm field-separate" id="archive" name="archive" accept="application/zip,audio/*,video/*,image/*" (change)="onArchiveSelected($event)" required>
					<div class="form-text field-separate"><span i18n>File size is limited to {{ this.fileSize.maximum }} MB.</span></div>
				</div>
			</div>

      <div class="form-group row">
				<div class="col-sm-4"></div>
				<div class="col-sm-8">
					<div class="form-check form-switch">
						<input class="form-check-input field-separate" type="checkbox" id="shared" name="shared" [(ngModel)]="attachment.shared"><label class="form-check-label" for="shared"><small><span i18n>Shared with all users</span></small></label>
					</div>
				</div>
			</div>

			<div class="form-group row">
				<label class="col-sm-4 col-form-label col-form-label-sm label-nobr"><span i18n>Life span</span></label>
				<div class="col-sm-2">
					<input type="number" min="0" max="365" class="form-control form-control-sm field-separate" id="lifeSpan" name="lifeSpan" [(ngModel)]="attachment.lifeSpan">
				</div>
				<label class="col-sm-6 col-form-label col-form-label-sm label-nobr"><span i18n>days before purged (0 for infinite retention)</span></label>
			</div>

		</div>
		<div class="card-footer hstack">
			<button type="button" class="btn bg-gradient btn-success btn-sm text-left" #uploadButton type="submit" [disabled]="!uploadFile"><fa-icon [icon]="faPlus"></fa-icon>&nbsp;<span i18n>Add</span></button>
			<div #labelMessage class="form-text" style="padding-left:10px;min-width:300px;"></div>
		</div>
	</div>
</form>
</div>
